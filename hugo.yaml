# OPIC 开放智能算力平台官网 —— Hugo + OINK 主题
# 迁移自 Docusaurus 3（2026-11-26）。配置基准：oink/tests/site/hugo.yaml
baseURL: https://opic.example.com/
title: OPIC 开放智能算力平台
theme: oink
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
disableKinds: [sitemap]

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: OPIC 开放智能算力平台
    hasCJKLanguage: true
    params:
      description: 本体论驱动的智算与 MaaS 一体化平台 · 23 个能力域 · 需求基线机器可校验
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 10
        - identifier: blog
          name: 动态
          pageRef: /blog
          weight: 20
        - identifier: github
          name: GitHub
          url: https://github.com/Project-Opic
          weight: 30
          params:
            icon: fa-brands fa-github
  en:
    label: English
    locale: en-US
    weight: 2
    title: OPIC Open Intelligent Computing Platform
    params:
      description: Ontology-driven intelligent computing & MaaS platform · 23 capability domains · machine-verifiable requirements baseline
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /en/docs
          weight: 10
        - identifier: blog
          name: Blog
          pageRef: /blog
          weight: 20
        - identifier: github
          name: GitHub
          url: https://github.com/Project-Opic
          weight: 30
          params:
            icon: fa-brands fa-github

taxonomies:
  tag: tags
  category: categories
  author: authors

# OINK 必需的 Goldmark 配置
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

# OINK 官方输出集（避免触发 i18n 解析兼容问题）
outputs:
  home: [HTML, LLMS, NAVJSON]
  section: [HTML, print, RSS, markdown]
  page: [HTML, markdown]

module:
  hugoVersion:
    min: "0.169.0"

params:
  name: OPIC
  description: 本体论驱动的智算与 MaaS 一体化平台 · 23 个能力域 · 需求基线机器可校验
  github_repo: https://github.com/Project-Opic/opic-website
  github_subdir: ""
  github_project_repo: https://github.com/Project-Opic/opic-website
  copyright:
    authors: '[OPIC 开放智能算力平台](https://opic.example.com)'
    from_year: 2026
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 10
  markmap: true
